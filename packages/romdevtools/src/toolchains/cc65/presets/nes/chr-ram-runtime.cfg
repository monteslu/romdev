# NES CHR-RAM linker config preset for romdev.
#
# DIFFERENCE FROM DEFAULT nes.cfg:
#   - HEADER's iNES byte 5 (CHR-ROM bank count) is set to 0 via the
#     project's own HEADER segment (the project must supply HEADER).
#     We don't ship HEADER bytes here because cc65's stock crt0.s emits
#     them — and pulling in stock crt0 also pulls in NESfont (4KB CHARS).
#     So this preset is meant to be used WITH a custom header source
#     that defines .segment "HEADER" + provides chr=0 bytes.
#   - ROM2 (8K CHR ROM bank) is REMOVED. Pattern tables live in CHR-RAM
#     ($0000-$1FFF on the PPU bus) and are written by your game at
#     runtime. There is no CHARS segment.
#
# To use this preset:
#   1. linkerConfig: "chr-ram" on build({output:'rom'})
#   2. Supply your own crt0/header source that writes the 16-byte iNES
#      header with byte 5 = 0. Easiest: paste the snippet
#      getStarterSnippet({platform:"nes", name:"chr_ram_header", language:"asm"}).
#   3. Write CHR data from C at runtime: PPUADDR = 0x00; PPUDATA = byte; etc.

SYMBOLS {
    # Stack is $0200 (512 B) so the top RAM page ($0700-$07FF) can be
    # reserved below for a music driver's scratch RAM (FamiTone2 et al.),
    # which needs a dedicated, page-aligned block that the C BSS/DATA
    # region must NOT overlap. Tiny NROM scaffolds use far less than 512 B
    # of stack, so this is safe; scaffolds with no music driver simply
    # leave the reserved page unused.
    __STACKSIZE__: type = weak, value = $0200;
}
MEMORY {
    ZP:     file = "", start = $0002, size = $001A, type = rw, define = yes;

    # INES Cartridge Header — provided by your project (HEADER segment).
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;

    # PRG-ROM: 2 × 16K = 32K (NROM-256 style; covers most projects).
    ROM0:   file = %O, start = $8000, size = $7FFA, fill = yes, define = yes;

    # Hardware vectors at end of PRG.
    ROMV:   file = %O, start = $FFFA, size = $0006, fill = yes;

    # NO ROM2 / CHARS — this is the whole point of the CHR-RAM preset.

    SRAM:   file = "", start = $0500, size = __STACKSIZE__, define = yes;

    # Reserved page for a sound-driver's RAM scratch ($0700-$07FF). The
    # bundled FamiTone2 engine (music_demo scaffold) pins FT_BASE_ADR here
    # so its ~90 bytes of channel/envelope state can't collide with the C
    # BSS/DATA at $0300-$04FF — that collision silently clobbers the NMI's
    # cached PPUCTRL and stalls rendering. Unused by non-music scaffolds.
    SNDRAM: file = "", start = $0700, size = $0100, define = yes;

    # BSS / DATA live in real RAM ($0300-$04FF, 512 bytes). NROM (mapper 0)
    # with no battery has $6000-$7FFF UNMAPPED — reads return open bus.
    # Putting BSS there means `int counter = 0;` reads garbage (intermittent
    # garbage that "works" only via open-bus parasitic capacitance).
    # 512 bytes is plenty for tiny NROM carts; for more, opt into a mapper
    # that maps PRG-RAM at $6000 and use a different preset.
    RAM:    file = "", start = $0300, size = $0200, define = yes;

    # Shadow OAM at $0200 (page 2). Game code populates this, NMI handler
    # DMAs it to PPU sprite RAM via $4014. 256 bytes = 64 sprites × 4.
    OAM:    file = "", start = $0200, size = $0100;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    HEADER:   load = HEADER,          type = ro;
    STARTUP:  load = ROM0,            type = ro,  define   = yes;
    LOWCODE:  load = ROM0,            type = ro,  optional = yes;
    ONCE:     load = ROM0,            type = ro,  optional = yes;
    CODE:     load = ROM0,            type = ro,  define   = yes;
    RODATA:   load = ROM0,            type = ro,  define   = yes;
    DATA:     load = ROM0, run = RAM, type = rw,  define   = yes;
    VECTORS:  load = ROMV,            type = rw;
    BSS:      load = RAM,             type = bss, define   = yes;
    OAM:      load = OAM,             type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
