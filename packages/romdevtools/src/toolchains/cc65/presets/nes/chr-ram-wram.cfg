# NES CHR-RAM linker config preset for romdev, with the C program's RAM in battery PRG-RAM.
#
# Same cart and runtime as chr-ram-runtime (NROM-256, CHR-RAM, vertical mirroring, iNES battery bit, the
# nes_runtime NMI handler in chr-ram-wram.crt0.s), but BSS and DATA live in the 8 KB PRG-RAM at $6000-$7FFF that the
# battery bit maps, instead of 512 bytes of internal RAM:
#   - $6000-$60FF: SAVE area. No segment is placed here and the crt0 never clears it, so it keeps its contents across
#     power cycles (hiscore_load/save use $6000-$6004; keep your own save data here too, behind a signature).
#   - $6100-$7FFF: BSS + DATA (7.75 KB), cleared / copied by the crt0 at every boot like internal RAM.
#   - $0300-$05FF: internal RAM no segment uses: free for absolute-addressed data (fast, not battery backed).
# Only for this header (battery bit set): without it NROM leaves $6000-$7FFF unmapped (see MENTAL_MODEL.md section 4).
#
# To use: linkerConfig: "chr-ram-wram" on build({output:'rom'}), with nes_runtime.c/.h as for chr-ram-runtime.

SYMBOLS {
    # C parameter stack is ONE page ($0600-$06FF, grows down from $0700), as in chr-ram-runtime. The top page
    # ($0700-$07FF) stays reserved for a music driver's scratch RAM (FamiTone2 et al.).
    __STACKSIZE__: type = weak, value = $0100;
}
MEMORY {
    ZP:     file = "", start = $0002, size = $001A, type = rw, define = yes;

    # INES Cartridge Header - provided by your project (HEADER segment).
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;

    # PRG-ROM: 2 × 16K = 32K (NROM-256 style; covers most projects).
    ROM0:   file = %O, start = $8000, size = $7FFA, fill = yes, define = yes;

    # Hardware vectors at end of PRG.
    ROMV:   file = %O, start = $FFFA, size = $0006, fill = yes;

    # NO ROM2 / CHARS - this is the whole point of the CHR-RAM preset.

    # $0300-$05FF: internal RAM with no segment (BSS/DATA moved to PRG-RAM) - game code may address it
    # absolutely, e.g. `#define BOARD ((unsigned char*)0x0300)`; the linker never places anything here.
    SRAM:   file = "", start = $0600, size = __STACKSIZE__, define = yes;

    # Reserved page for a sound-driver's RAM scratch ($0700-$07FF). The
    # bundled FamiTone2 engine (music_demo scaffold) pins FT_BASE_ADR here
    # so its ~90 bytes of channel/envelope state can't collide with the C
    # BSS/DATA. Unused by non-music scaffolds.
    SNDRAM: file = "", start = $0700, size = $0100, define = yes;

    # BSS / DATA in battery PRG-RAM above the 256-byte SAVE area ($6000-$60FF), which the header's battery bit maps.
    RAM:    file = "", start = $6100, size = $1F00, define = yes;

    # Shadow OAM at $0200 (page 2). Game code populates this, NMI handler
    # DMAs it to PPU sprite RAM via $4014. 256 bytes = 64 sprites × 4.
    OAM:    file = "", start = $0200, size = $0100;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    HEADER:   load = HEADER,          type = ro;
    STARTUP:  load = ROM0,            type = ro,  define   = yes;
    LOWCODE:  load = ROM0,            type = ro,  optional = yes;
    ONCE:     load = ROM0,            type = ro,  optional = yes;
    CODE:     load = ROM0,            type = ro,  define   = yes;
    RODATA:   load = ROM0,            type = ro,  define   = yes;
    DATA:     load = ROM0, run = RAM, type = rw,  define   = yes;
    VECTORS:  load = ROMV,            type = rw;
    BSS:      load = RAM,             type = bss, define   = yes;
    OAM:      load = OAM,             type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
